aid: nucleus-genomics
name: Nucleus Genomics
description: 'Nucleus Genomics (product brand "Nucleus", mynucleus.com) is a New York
  based consumer genomics company founded in 2021 by Kian Sadeghi. It sells a physician-ordered,
  clinical-grade DNA health test built on 30x whole-genome sequencing (Illumina NovaSeq
  X) across three products: Health (risk and trait insights across 900+ diseases),
  Family (preconception carrier screening across 2,000+ inheritable conditions) and
  IVF+ / Nucleus Embryo (genetics-forward IVF including polygenic embryo screening).
  Members access results through app.mynucleus.com and can download raw data as VCF
  or FASTQ. Sequencing is performed in the United States; the company states it is
  HIPAA compliant, CLIA certified and CAP accredited, and publishes a Vanta-hosted
  trust center. As of this profiling pass Nucleus publishes no public developer API,
  API reference, SDK or machine-readable contract — its published machine surface is
  an llms.txt, a security.txt, an Instatus status page and the trust center.'
